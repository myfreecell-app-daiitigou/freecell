<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ソリティア</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ソリティア">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#117a4b">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 全ての視覚エフェクト（火花・花火・トランプの滝・雨）を描画するキャンバス -->
    <canvas id="confetti-canvas"></canvas>

    <!-- クライマックス時のカットインバナー -->
    <div id="climax-banner" class="climax-banner hidden"></div>

    <!-- ドラッグ追従用コンテナ -->
    <div id="drag-proxy" class="drag-proxy"></div>

    <!-- ゲーム情報ステータスバー -->
    <div id="game-status">
        <div>モード: <span id="game-mode-display">1枚ドロー</span></div>
        <div>タイム: <span id="game-timer">00:00</span></div>
        <div>ムーブ: <span id="move-count">0</span></div>
    </div>

    <!-- ドキドキ進行度ゲージ -->
    <div id="progress-wrapper">
        <div id="progress-bar"></div>
        <span id="progress-text">ゴールまで: 0 / 52枚</span>
    </div>

    <!-- コントロールボタン -->
    <div id="controls">
        <button onclick="openModeSelectModal()">ニューゲーム</button>
        <button onclick="undoMove()">1手戻す</button>
        <button onclick="redoMove()">やり直す</button>
        <button onclick="giveHint()">ヒント</button>
        <button id="auto-btn" onclick="triggerAutoComplete()">オート</button>
        <button id="sound-btn" onclick="toggleSound()">🔊 サウンド</button>
        <button onclick="openStatsModal()">スコア</button>
    </div>

    <div id="game-board">
        <!-- 上部エリア：組札4マス ＋ めくり札・山札 -->
        <div id="top-area">
            <div id="foundations" class="area"></div>
            <div id="stock-waste-area" class="area">
                <div id="waste-slot" class="cell"></div>
                <div id="stock-slot" class="cell" onclick="handleStockClick()"></div>
            </div>
        </div>
        <!-- 下部エリア：7列のフィールド -->
        <div id="tableau" class="area"></div>
    </div>

    <!-- モードセレクト ポップアップ -->
    <div id="mode-modal" class="modal hidden">
        <div class="modal-content">
            <h2>✨ ゲームメニュー ✨</h2>
            <p>遊び方を選択してください</p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 16px;">
                <button class="big-btn primary-btn" onclick="startNewGameWithMode(1)">🌟 1枚ドローで新しく遊ぶ</button>
                <button class="big-btn secondary-btn" onclick="startNewGameWithMode(3)">🔥 3枚ドローで新しく遊ぶ</button>
                <button class="big-btn retry-btn" onclick="retryCurrentGame()">🔄 今の配置を最初からやり直す</button>
                <button style="margin-top: 6px;" onclick="closeModeSelectModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- ゲームクリア ポップアップ -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content celebration-content">
            <div class="crown-icon">👑</div>
            <h2>🎉 パーフェクトクリア！ 🎉</h2>
            <div id="new-record-badge" class="record-badge hidden">🏆 新記録達成！</div>
            <p style="font-size: 15px; font-weight: bold; color: #d32f2f; margin: 6px 0;">すべてのカードがコンプリートされました！</p>
            <div class="result-box">
                <p style="margin: 4px 0;">⏱ クリアタイム: <span id="final-time" class="highlight-val">00:00</span></p>
                <p style="margin: 4px 0;">🃏 トータルムーブ: <span id="final-moves" class="highlight-val">0</span> 手</p>
            </div>
            <button class="big-btn primary-btn pulse-btn" onclick="restartFromWinModal()">もう一度プレイ！</button>
        </div>
    </div>

    <!-- 手詰まり（ゲームオーバー） ポップアップ -->
    <div id="stalemate-modal" class="modal hidden">
        <div class="modal-content sad-content">
            <div class="sad-icon">🌧️</div>
            <h2>😢 ざんねん… 手詰まりです</h2>
            <p>これ以上動かせるカードがなくなってしまいました。<br>でも大丈夫！1手戻すか、同じ配置でリベンジしよう！</p>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
                <button class="big-btn retry-btn" onclick="retryCurrentGame()">🔄 この配置を最初からやり直す</button>
                <div style="display: flex; gap: 8px;">
                    <button onclick="closeStalemateModal()">盤面に戻る</button>
                    <button class="primary-btn" onclick="openModeSelectModal()">ニューゲーム</button>
                </div>
            </div>
        </div>
    </div>

    <!-- プレイデータ（スコア） ポップアップ -->
    <div id="stats-modal" class="modal hidden">
        <div class="modal-content">
            <h2>📊 プレイデータ</h2>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-label">トータルプレイ:</span> <span><span id="stat-played">0</span> 回</span></div>
                <div class="stat-item"><span class="stat-label">クリア数:</span> <span><span id="stat-won">0</span> 回</span></div>
                <div class="stat-item"><span class="stat-label">勝率:</span> <span id="stat-winrate">0%</span></div>
                <div class="stat-item"><span class="stat-label">ベストタイム:</span> <span id="stat-best-time">--:--</span></div>
                <div class="stat-item"><span class="stat-label">最少ムーブ:</span> <span><span id="stat-fewest-moves">-</span> 手</span></div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="closeStatsModal()">閉じる</button>
                <button class="danger-btn" onclick="resetAllStats()">データをリセット</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker 登録成功:', reg.scope))
                    .catch((err) => console.log('Service Worker 登録失敗:', err));
            });
        }
    </script>
</body>
</html>
