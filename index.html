<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ソリティア</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ソリティア">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5a36">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div id="drag-proxy" class="drag-proxy"></div>

    <div id="game-status">
        <div>モード: <span id="game-mode-display">1枚ドロー</span></div>
        <div>タイム: <span id="game-timer">00:00</span></div>
        <div>ムーブ: <span id="move-count">0</span></div>
    </div>

    <div id="controls">
        <button onclick="openModeSelectModal()">ニューゲーム</button>
        <button onclick="undoMove()">1手戻す</button>
        <button onclick="redoMove()">やり直す</button>
        <button onclick="giveHint()">ヒント</button>
        <button onclick="triggerAutoComplete()">オート</button>
        <button id="sound-btn" onclick="toggleSound()">🔊 サウンド</button>
        <button onclick="openStatsModal()">スコア</button>
    </div>

    <div id="game-board">
        <div id="top-area">
            <div id="foundations" class="area"></div>
            <div id="stock-waste-area" class="area">
                <div id="waste-slot" class="cell"></div>
                <div id="stock-slot" class="cell" onclick="handleStockClick()"></div>
            </div>
        </div>
        <div id="tableau" class="area"></div>
    </div>

    <!-- モード選択ポップアップ -->
    <div id="mode-modal" class="modal hidden">
        <div class="modal-content">
            <h2>ニューゲーム</h2>
            <p>山札をめくるドロールールを選択してください</p>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
                <button class="big-btn primary-btn" onclick="startNewGameWithMode(1)">🌟 1枚ドロー（イージー・初級）</button>
                <button class="big-btn secondary-btn" onclick="startNewGameWithMode(3)">🔥 3枚ドロー（ノーマル・標準）</button>
                <button style="margin-top: 10px;" onclick="closeModeSelectModal()">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- クリア画面 -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content celebration-content">
            <h2>🎉 ゲームクリア！ 🎉</h2>
            <p style="font-size: 16px; font-weight: bold; color: #d32f2f;">すべてのカードがコンプリートされました！</p>
            <div style="background: rgba(0,0,0,0.05); padding: 12px; border-radius: 8px; margin: 15px 0;">
                <p>クリアタイム: <span id="final-time" style="font-weight: bold;">00:00</span></p>
                <p>トータルムーブ: <span id="final-moves" style="font-weight: bold;">0</span> 手</p>
            </div>
            <button class="big-btn primary-btn" onclick="restartFromWinModal()">もう一度プレイ！</button>
        </div>
    </div>

    <!-- 手詰まり画面 -->
    <div id="stalemate-modal" class="modal hidden">
        <div class="modal-content">
            <h2>⚠️ ゲームオーバー</h2>
            <p>これ以上動かせる有効なカードがありません。<br>「1手戻す」で前の手をやり直すか、<br>新しいゲームをスタートしてください。</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button onclick="closeStalemateModal()">盤面に戻る</button>
                <button class="primary-btn" onclick="openModeSelectModal()">ニューゲーム</button>
            </div>
        </div>
    </div>

    <!-- スコア画面 -->
    <div id="stats-modal" class="modal hidden">
        <div class="modal-content">
            <h2>📊 プレイデータ</h2>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-label">トータルプレイ:</span> <span id="stat-played">0</span> 回</div>
                <div class="stat-item"><span class="stat-label">クリア数:</span> <span id="stat-won">0</span> 回</div>
                <div class="stat-item"><span class="stat-label">勝率:</span> <span id="stat-winrate">0%</span></div>
                <div class="stat-item"><span class="stat-label">ベストタイム:</span> <span id="stat-best-time">--:--</span></div>
                <div class="stat-item"><span class="stat-label">最少ムーブ:</span> <span id="stat-fewest-moves">-</span> 手</div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="closeStatsModal()">閉じる</button>
                <button class="danger-btn" onclick="resetAllStats()">データをリセット</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker 登録成功:', reg.scope))
                    .catch((err) => console.log('Service Worker 登録失敗:', err));
            });
        }
    </script>
</body>
</html>
